<layout name="admin_canned_replies" version="1.0.0" extends="_admin_base">
  <meta title="$t:glitter-help_desk.admin.canned_replies.title"/>
  <data-source id="replies" type="api" endpoint="/api/modules/glitter-help_desk/admin/canned-replies" method="GET" :auto_fetch="true" :auth_required="true"/>
  <slot name="content"><div class="admin-page-content-responsive-fluid"><page-header data-type="composite" title="$t:glitter-help_desk.admin.canned_replies.title"/>
    <section class="admin-card space-y-4"><h2 class="section-heading">$t:glitter-help_desk.admin.canned_replies.create_heading</h2><form class="space-y-4"><on type="submit" preventDefault="true"><api-call target="/api/modules/glitter-help_desk/admin/canned-replies" method="POST" :auth_required="true"><success><refetch-data-source dataSourceId="replies" :sync="true"/></success><fail><toast type="error" message="{{error.message}}"/></fail><body title="{{$event.target.elements.title.value}}" body="{{$event.target.elements.body.value}}"/></api-call></on>
      <div class="grid grid-cols-1 gap-4 items-start"><div class="min-w-0"><label for="new_reply_title" class="form-label">$t:glitter-help_desk.admin.canned_replies.title_field</label><input id="new_reply_title" class="input w-full h-10" name="title" required="required" maxlength="120"/></div><div class="min-w-0"><label for="new_reply_body" class="form-label">$t:glitter-help_desk.admin.ticket.reply</label><textarea id="new_reply_body" class="textarea w-full" name="body" rows="6" required="required" maxlength="20000"/></div></div><button class="btn btn-primary w-full sm:w-auto" type="submit">$t:glitter-help_desk.admin.canned_replies.create</button>
    </form></section>
    <div data-if="{{replies === undefined}}" class="admin-card text-body">$t:glitter-help_desk.common.loading</div>
    <section data-if="{{replies !== undefined}}" class="admin-card space-y-4"><h2 class="section-heading">$t:glitter-help_desk.admin.canned_replies.list_heading</h2><empty-state data-type="composite" data-if="{{(replies?.data?.data ?? []).length === 0}}" iconName="comment" title="$t:glitter-help_desk.admin.canned_replies.empty" description="$t:glitter-help_desk.admin.canned_replies.empty_description" class="py-4"/>
      <div data-each="reply in {{replies?.data?.data ?? []}}" class="min-w-0 rounded-lg border p-4"><form class="space-y-4"><on type="submit" preventDefault="true"><api-call target="/api/modules/glitter-help_desk/admin/canned-replies/{{reply.id}}" method="PATCH" :auth_required="true"><success><refetch-data-source dataSourceId="replies" :sync="true"/></success><fail><toast type="error" message="{{error.message}}"/></fail><body title="{{$event.target.elements.title.value}}" body="{{$event.target.elements.body.value}}" is_active="{{$event.target.elements.is_active.checked}}"/></api-call></on>
        <div class="grid grid-cols-1 gap-4 items-start"><div class="min-w-0"><label class="form-label">$t:glitter-help_desk.admin.canned_replies.title_field</label><input class="input w-full h-10" name="title" value="{{reply.title}}" required="required" maxlength="120"/></div><div class="min-w-0"><label class="form-label">$t:glitter-help_desk.admin.ticket.reply</label><textarea class="textarea w-full" name="body" rows="6" required="required" maxlength="20000">{{reply.body}}</textarea></div></div>
        <div class="flex flex-wrap items-center gap-3"><input id="reply_active_{{reply.id}}" name="is_active" type="checkbox" checked="{{reply.is_active}}"/><label for="reply_active_{{reply.id}}">$t:glitter-help_desk.admin.categories.active</label><button class="btn btn-secondary" type="submit">$t:glitter-help_desk.admin.canned_replies.save</button><button class="btn btn-danger" type="button"><on type="click"><api-call target="/api/modules/glitter-help_desk/admin/canned-replies/{{reply.id}}" method="DELETE" confirm="$t:glitter-help_desk.admin.canned_replies.delete_confirm" :auth_required="true"><success><refetch-data-source dataSourceId="replies" :sync="true"/></success><fail><toast type="error" message="{{error.message}}"/></fail></api-call></on>$t:glitter-help_desk.admin.canned_replies.delete</button></div>
      </form></div>
    </section>
  </div></slot>
</layout>

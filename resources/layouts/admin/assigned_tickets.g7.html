<layout name="admin_assigned_tickets" version="1.0.0" extends="_admin_base">
  <meta title="$t:glitter-help_desk.admin.assigned.title"/>
  <data-source id="tickets" type="api" endpoint="/api/modules/glitter-help_desk/admin/my-tickets" method="GET" :auto_fetch="true" :auth_required="true" :refetchOnMount="true"><params page="{{query.page}}" per_page="25" status="{{query.status}}" q="{{query.q}}"/></data-source>
  <slot name="content"><div class="admin-page-content-responsive-fluid">
    <page-header data-type="composite" title="$t:glitter-help_desk.admin.assigned.title"/>
    <section class="admin-card"><h2 class="section-heading mb-4">$t:glitter-help_desk.admin.tickets.filters</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
      <div class="min-w-0 md:col-span-2"><search-bar data-type="composite" name="q" placeholder="$t:glitter-help_desk.admin.tickets.search" value="{{query.q || ''}}" class="w-full h-10"><on type="submit"><navigate path="/admin/helpdesk/assigned" :mergeQuery="true"><query :page="1" q="{{$event.target.q.value}}" status="{{query.status}}"/></navigate></on></search-bar></div>
      <div class="min-w-0"><label for="assigned_status" class="form-label">$t:glitter-help_desk.fields.status</label><select id="assigned_status" class="select w-full h-10" value="{{query.status || ''}}"><on type="change"><navigate path="/admin/helpdesk/assigned" :mergeQuery="true"><query :page="1" status="{{$event.target.value}}" q="{{query.q}}"/></navigate></on><option value="">$t:glitter-help_desk.user.list.all_statuses</option><option value="open">$t:glitter-help_desk.status.open</option><option value="in_progress">$t:glitter-help_desk.status.in_progress</option><option value="waiting_customer">$t:glitter-help_desk.status.waiting_customer</option><option value="resolved">$t:glitter-help_desk.status.resolved</option><option value="closed">$t:glitter-help_desk.status.closed</option></select></div>
    </div></section>
    <div data-if="{{tickets === undefined}}" class="admin-card text-body">$t:glitter-help_desk.common.loading</div>
    <section data-if="{{tickets !== undefined}}" class="admin-card"><empty-state data-type="composite" data-if="{{(tickets?.data?.data ?? []).length === 0}}" iconName="file-alt" title="$t:glitter-help_desk.admin.assigned.empty" description="$t:glitter-help_desk.admin.assigned.empty_description" class="py-4"/>
      <card-grid data-if="{{(tickets?.data?.data ?? []).length > 0}}" data-type="composite" data="{{tickets?.data?.data ?? []}}" :gridColumns="2" cardClassName="card-clickable h-full" :pagination="true" :serverSidePagination="true" serverCurrentPage="{{tickets?.data?.current_page ?? 1}}" serverTotalPages="{{tickets?.data?.last_page ?? 1}}" pageHref="/admin/helpdesk/assigned?page={page}" :pageHrefMergeQuery="true" emptyMessage="$t:glitter-help_desk.admin.assigned.empty"><card id="assigned_ticket_card" class="p-4 h-full"><a class="text-heading break-words" href="/admin/helpdesk/tickets/{{row.id}}" :mergeQuery="true"><on type="click"><navigate path="/admin/helpdesk/tickets/{{row.id}}" :mergeQuery="true"><query/></navigate></on><h2 class="break-words">{{row.subject}}</h2></a><p class="text-label-subtle mt-2 break-words">{{row.ticket_number}}</p><status-badge data-type="composite" status="{{row.status === 'resolved' ? 'success' : (row.status === 'closed' ? 'default' : (row.status === 'waiting_customer' ? 'warning' : (row.status === 'in_progress' ? 'info' : 'pending')))}}" label="{{$t('glitter-help_desk.status.' + row.status)}}"/></card></card-grid>
    </section>
  </div></slot>
</layout>

<layout name="admin_categories" version="1.0.0" extends="_admin_base">
  <meta title="$t:glitter-help_desk.admin.categories.title"/>
  <data-source id="categories" type="api" endpoint="/api/modules/glitter-help_desk/admin/categories" method="GET" :auto_fetch="true" :auth_required="true"/>
  <slot name="content"><div class="admin-page-content-responsive-fluid"><page-header data-type="composite" title="$t:glitter-help_desk.admin.categories.title"/>
    <section class="admin-card space-y-4"><h2 class="section-heading">$t:glitter-help_desk.admin.categories.create_heading</h2>
      <form class="space-y-4"><on type="submit" preventDefault="true"><api-call target="/api/modules/glitter-help_desk/admin/categories" method="POST" :auth_required="true"><success><refetch-data-source dataSourceId="categories" :sync="true"/></success><fail><toast type="error" message="{{error.message}}"/></fail><body name="{{$event.target.elements.name.value}}" parent_id="{{$event.target.elements.parent_id.value || null}}" sort_order="{{$event.target.elements.sort_order.value}}" is_active="{{$event.target.elements.is_active.checked}}"/></api-call></on>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-12 gap-4 items-end"><div class="min-w-0 xl:col-span-5"><label for="new_category_name" class="form-label">$t:glitter-help_desk.admin.categories.name</label><input class="input w-full" id="new_category_name" name="name" required="required" maxlength="120"/></div>
          <div class="min-w-0 xl:col-span-4"><label for="new_category_parent" class="form-label">$t:glitter-help_desk.admin.categories.parent</label><select class="select w-full" id="new_category_parent" name="parent_id"><option value="">$t:glitter-help_desk.admin.categories.no_parent</option><option data-each="category in {{categories?.data?.data ?? []}}" value="{{category.id}}">{{category.name}}</option></select></div>
          <div class="min-w-0 xl:col-span-1"><label for="new_category_sort" class="form-label">$t:glitter-help_desk.admin.categories.sort_order</label><input class="input w-full" id="new_category_sort" name="sort_order" type="number" min="0" value="0"/></div>
          <div class="min-w-0 flex items-center gap-2 h-10 xl:col-span-2"><input id="new_category_active" name="is_active" type="checkbox" checked="checked"/><label for="new_category_active">$t:glitter-help_desk.admin.categories.active</label></div></div>
        <button class="btn btn-primary w-full sm:w-auto" type="submit">$t:glitter-help_desk.admin.categories.create</button>
      </form>
    </section>
    <div data-if="{{categories === undefined}}" class="admin-card text-body">$t:glitter-help_desk.common.loading</div>
    <section data-if="{{categories !== undefined}}" class="admin-card space-y-4"><h2 class="section-heading">$t:glitter-help_desk.admin.categories.list_heading</h2>
      <empty-state data-type="composite" data-if="{{(categories?.data?.data ?? []).length === 0}}" iconName="folder" title="$t:glitter-help_desk.admin.categories.empty" description="$t:glitter-help_desk.admin.categories.empty_description" class="py-4"/>
      <div data-each="category in {{categories?.data?.data ?? []}}" class="min-w-0 rounded-lg border p-4"><form class="space-y-4"><on type="submit" preventDefault="true"><api-call target="/api/modules/glitter-help_desk/admin/categories/{{category.id}}" method="PATCH" :auth_required="true"><success><refetch-data-source dataSourceId="categories" :sync="true"/></success><fail><toast type="error" message="{{error.message}}"/></fail><body name="{{$event.target.elements.name.value}}" parent_id="{{$event.target.elements.parent_id.value || null}}" sort_order="{{$event.target.elements.sort_order.value}}" is_active="{{$event.target.elements.is_active.checked}}"/></api-call></on>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-12 gap-4 items-end"><div class="min-w-0 xl:col-span-5"><label class="form-label">$t:glitter-help_desk.admin.categories.name</label><input class="input w-full" name="name" value="{{category.name}}" required="required" maxlength="120"/></div>
          <div class="min-w-0 xl:col-span-4"><label class="form-label">$t:glitter-help_desk.admin.categories.parent</label><select class="select w-full h-10" name="parent_id" value="{{category.parent_id ?? ''}}"><option value="">$t:glitter-help_desk.admin.categories.no_parent</option><option data-each="parent in {{categories?.data?.data ?? []}}" data-if="{{parent.id !== category.id}}" value="{{parent.id}}">{{parent.name}}</option></select></div>
          <div class="min-w-0 xl:col-span-1"><label class="form-label">$t:glitter-help_desk.admin.categories.sort_order</label><input class="input w-full h-10" name="sort_order" type="number" min="0" value="{{category.sort_order}}"/></div><div class="min-w-0 flex items-center gap-2 h-10 xl:col-span-2"><input id="category_active_{{category.id}}" name="is_active" type="checkbox" checked="{{category.is_active}}"/><label for="category_active_{{category.id}}">$t:glitter-help_desk.admin.categories.active</label></div></div>
        <button class="btn btn-secondary" type="submit">$t:glitter-help_desk.admin.categories.save</button></form></div>
    </section>
  </div></slot>
</layout>

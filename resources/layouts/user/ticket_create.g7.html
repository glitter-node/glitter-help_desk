<layout name="user_ticket_create" version="1.0.0" extends="_user_base">
  <meta title="$t:glitter-help_desk.user.create.title"/>
  <data-source id="categories" type="api" endpoint="/api/modules/glitter-help_desk/user/categories" method="GET" :auto_fetch="true" :auth_required="true"/>
  <init><set-state target="local" createRequestKey="{{$uuid()}}"/></init>
  <slot name="content">
    <div class="glitter-help-desk-shell space-y-6">
      <div class="space-y-1">
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">$t:glitter-help_desk.user.create.title</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400">$t:glitter-help_desk.user.create.description</p>
      </div>
      <form data-ref="ticket_create_form" class="space-y-5">
        <on type="submit" debounce="1000">
          <api-call target="/api/modules/glitter-help_desk/user/tickets" method="POST" :auth_required="true">
            <success><navigate path="/my/tickets/{{response?.data?.data?.id}}"/></success>
            <fail><toast type="error" message="{{error.message}}"/></fail>
            <body request_key="{{_local.createRequestKey}}" subject="{{$event.target.elements.subject.value}}" body="{{$event.target.elements.body.value}}" category_id="{{$event.target.elements.category_id.value}}"/>
          </api-call>
        </on>
        <div class="space-y-2">
          <label for="subject" class="form-label">$t:glitter-help_desk.fields.subject</label>
          <input id="subject" class="input w-full" name="subject" required="required" maxlength="200"/>
        </div>
        <div class="space-y-2">
          <label for="category_id" class="form-label">$t:glitter-help_desk.fields.category</label>
          <select id="category_id" class="input w-full" name="category_id">
            <option value="">$t:glitter-help_desk.user.create.no_category</option>
            <option data-each="category in {{categories?.data ?? []}}" value="{{category.id}}">{{category.name}}</option>
          </select>
        </div>
        <div class="space-y-2">
          <label for="body" class="form-label">$t:glitter-help_desk.fields.message</label>
          <textarea id="body" class="textarea min-h-48 w-full" name="body" required="required" maxlength="20000"></textarea>
        </div>
        <div class="flex justify-end">
          <button class="btn btn-primary w-full sm:w-auto" type="submit" :lockRepeatClick="true">$t:glitter-help_desk.user.create.submit</button>
        </div>
      </form>
    </div>
  </slot>
</layout>
